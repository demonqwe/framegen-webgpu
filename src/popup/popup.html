<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime FrameGen</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <div class="icon-glow">⚡</div>
        <div>
          <h1>Anime FrameGen</h1>
          <span class="subtitle">RIFE FP16 + Anime4K WebGPU</span>
        </div>
      </div>
      <label class="switch">
        <input type="checkbox" id="masterToggle" checked>
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Section -->
    <div class="card status-card">
      <div class="status-row">
        <span class="label">Статус:</span>
        <span class="value" id="statusText">Поиск плеера...</span>
      </div>
      <div class="status-row">
        <span class="label">Частота кадров (FPS):</span>
        <span class="value highlight" id="fpsCounter">-- FPS</span>
      </div>
      <div class="status-row">
        <span class="label">Разрешение видео:</span>
        <span class="value" id="videoRes">--</span>
      </div>
      <div class="status-row">
        <span class="label">WebGPU (shader-f16):</span>
        <span class="value badge-tag" id="webgpuStatus">Проверка...</span>
      </div>
    </div>

    <!-- Settings Section -->
    <div class="card settings-card">
      <h3>Настройки генерации</h3>

      <div class="form-group">
        <label for="fpsMode">Режим интерполяции:</label>
        <select id="fpsMode" class="custom-select">
          <option value="2x">2x Генерация кадров (24 → 48/60 FPS)</option>
          <option value="native">Нативный FPS (Только Anime4K)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="resolutionProfile">Профиль разрешения RIFE:</label>
        <select id="resolutionProfile" class="custom-select">
          <option value="auto">Авто (по разрешению видео)</option>
          <option value="720p">720p (Быстрый FP16)</option>
          <option value="1080p">1080p (Максимальное качество)</option>
        </select>
      </div>

      <div class="form-group">
        <div class="label-with-val">
          <label for="anime4kStrength">Сила контуров Anime4K:</label>
          <span id="strengthValue" class="slider-val">0.8</span>
        </div>
        <input type="range" id="anime4kStrength" min="0" max="1.5" step="0.1" value="0.8" class="range-slider">
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">
          <input type="checkbox" id="showBadge" checked>
          <span>Отображать статус-бейдж на видео</span>
        </label>
      </div>
    </div>

    <footer class="footer">
      <span>RTX 5060 Ti Ready • Zero-Copy Pipeline</span>
    </footer>
  </div>

  <script type="module" src="popup.ts"></script>
</body>
</html>
