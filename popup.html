<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FrameGen WebGPU</title>
  <link rel="stylesheet" href="./src/popup/popup.css">
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="brand">
        <span class="brand-title">FrameGen WebGPU</span>
        <span class="brand-sub">60-240 FPS & 1440p Scaler</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="masterToggle">
        <span class="slider"></span>
      </label>
    </header>

    <!-- Status Panel -->
    <div class="panel">
      <div class="panel-row">
        <span class="dim">Частота кадров</span>
        <span class="val highlight" id="fpsCounter">-- FPS</span>
      </div>
      <div class="panel-row">
        <span class="dim">Разрешение</span>
        <span class="val" id="videoRes">--</span>
      </div>
      <div class="panel-row">
        <span class="dim">Статус плеера</span>
        <span class="val" id="statusText">Поиск плеера...</span>
      </div>
    </div>

    <!-- Mode Selector -->
    <div class="section-title">Режим работы</div>
    <div class="segmented-control">
      <button type="button" class="seg-btn active" data-mode="hybrid">Гибридный</button>
      <button type="button" class="seg-btn" data-mode="generator_only">Кадры</button>
      <button type="button" class="seg-btn" data-mode="upscale_only">Апскейл</button>
    </div>

    <!-- Controls -->
    <div class="panel">
      <div class="control-row">
        <label for="scalerSelect" class="dim">Алгоритм апскейла</label>
        <select id="scalerSelect" class="select-box">
          <option value="fsr">AMD FSR 1.0 (EASU + RCAS)</option>
          <option value="anime4k">Anime4K v4.0 (Line Thinning)</option>
          <option value="span">SPAN x2 (Субпиксельный)</option>
          <option value="compact">Real-ESRGAN Compact x2 (Деблок)</option>
          <option value="bicubic">Bicubic Catmull-Rom (16-Tap)</option>
          <option value="off">Выкл (1:1 без масштабирования)</option>
        </select>
      </div>

      <div class="control-row">
        <label for="multiplierModeSelect" class="dim">Тип частоты</label>
        <select id="multiplierModeSelect" class="select-box">
          <option value="fixed">Фиксированный множитель</option>
          <option value="target_fps">Плавающий множитель (Целевой FPS)</option>
        </select>
      </div>

      <div class="control-row" id="fixedMultiplierRow">
        <label for="multiplierSelect" class="dim">Множитель</label>
        <select id="multiplierSelect" class="select-box">
          <option value="2">x2</option>
          <option value="3">x3</option>
          <option value="4">x4</option>
        </select>
      </div>

      <div class="control-row" id="targetFpsRow" style="display: none;">
        <label for="targetFpsSelect" class="dim">Целевой FPS</label>
        <select id="targetFpsSelect" class="select-box">
          <option value="60">60 FPS</option>
          <option value="75">75 FPS</option>
          <option value="90">90 FPS</option>
          <option value="120">120 FPS</option>
          <option value="144">144 FPS</option>
          <option value="165">165 FPS</option>
          <option value="240">240 FPS</option>
        </select>
      </div>

      <div class="control-row">
        <label for="autoBypassFpsInput" class="dim">Авто-пропуск от (FPS)</label>
        <div style="display: flex; align-items: center; gap: 6px;">
          <input type="number" id="autoBypassFpsInput" min="0" max="240" step="1" value="60" class="select-box" style="width: 70px; text-align: center; padding: 4px 6px;">
          <span style="font-size: 10px; color: #64748b;">FPS (0=Выкл)</span>
        </div>
      </div>

      <div class="control-row-col">
        <div class="label-val-row">
          <span class="dim">Резкость и шарпенинг</span>
          <span class="val-num" id="sharpnessValue">80%</span>
        </div>
        <input type="range" id="fsrSharpness" min="0" max="1.0" step="0.05" value="0.8" class="range-input">
      </div>

      <div class="checkbox-row">
        <label class="check-label">
          <input type="checkbox" id="animeCadenceDetection" checked>
          <span>Умный каденс аниме (пропуск дубликатов)</span>
        </label>
      </div>

      <div class="checkbox-row">
        <label class="check-label">
          <input type="checkbox" id="showSideControls" checked>
          <span>Отображать боковой переключатель слева</span>
        </label>
      </div>
    </div>

    <footer class="footer">
      <span>Нажмите Shift+D во время видео для мониторинга</span>
    </footer>
  </div>

  <script type="module" src="./src/popup/popup.ts"></script>
</body>
</html>
